name: CI/CD Backend Despachos

# Trigger: solo se activa con push en la rama deploy
on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar credenciales AWS desde GitHub Secrets
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Login a Amazon ECR
      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Construir imagen Docker (multi-stage)
      - name: Build imagen Docker
        run: |
          docker build -t despacho-backend .

      # 5. Etiquetar y publicar imagen en ECR
      - name: Tag y Push a ECR
        run: |
          docker tag despacho-backend:latest ${{ secrets.ECR_REPO_URL_BACKEND }}:latest
          docker tag despacho-backend:latest ${{ secrets.ECR_REPO_URL_BACKEND }}:${{ github.sha }}
          docker push ${{ secrets.ECR_REPO_URL_BACKEND }}:latest
          docker push ${{ secrets.ECR_REPO_URL_BACKEND }}:${{ github.sha }}

      # 6. Despliegue automático en EC2 via SSM (sin SSH expuesto)
      - name: Deploy en EC2 Backend via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}",
              "docker pull ${{ secrets.ECR_REPO_URL_BACKEND }}:latest",
              "docker stop despacho-backend || true",
              "docker rm despacho-backend || true",
              "docker run -d --name despacho-backend -p 8081:8081 --restart unless-stopped -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} -e DB_PORT=3306 -e DB_NAME=${{ secrets.DB_NAME }} -e DB_USERNAME=${{ secrets.DB_USERNAME }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} ${{ secrets.ECR_REPO_URL_BACKEND }}:latest"
            ]' \
            --region ${{ secrets.AWS_REGION }}
